<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Archiv der Unendlichkeit</title>
<meta name="description" content="Mathematisches Escape Game – Seminarfachprojekt der 13. Klasse: Höhere Mathematik, deren Geschichte und Anwendung.">
<style>
/* =====================================================================
   Das Archiv der Unendlichkeit – GESTALTUNG
   Layout: Ein Raum pro Seite. Oben die Szene, darunter Pergament-
   Arbeitsflächen; alles Bedienbare ist in Messing gehalten.
   Bewusst nur eine (dunkle) Farbwelt: alte Bibliothek bei Lampenlicht.
   Schriften: nur Systemschriften – funktioniert offline und ohne
   externe Schriftanbieter.
   ===================================================================== */
:root {
  color-scheme: dark;
  /* Farben */
  --night: #140d08;          /* dunkles Nussholz, Seitengrund */
  --wood: #2b1b11;           /* Paneele und Karten */
  --wood-hi: #3d2717;
  --wood-line: #5a3b22;
  --parchment: #efe3c6;      /* Papier */
  --parchment-deep: #dcc89c;
  --ink: #2a1c10;            /* Tinte auf Papier */
  --ink-soft: #5b4630;
  --brass: #c99a3b;          /* Bedienelemente */
  --brass-hi: #ecc66d;
  --brass-deep: #8a6420;
  --text: #f1e6cf;           /* Text auf Holz */
  --text-dim: #c7b48f;
  --wax: #9b2f22;            /* rote Tinte, Siegel */
  --ok: #8fc27a;
  --ok-ink: #2f5a22;
  --bad: #f08b6e;
  --bad-ink: #8a2c14;
  --blue-ink: #24519b;
  --chalk: #f3f1e7;
  --console: #0f1a17;
  --console-text: #9fe3c4;
  --focus: #ffd36b;
  /* Schriften */
  --font-display: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", P052, Georgia, serif;
  --font-body: Georgia, "Iowan Old Style", Charter, "Bitstream Charter", "Sitka Text", Cambria, "Noto Serif", serif;
  --font-hand: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Neue", "Comic Sans MS", "Coming Soon", casual, cursive;
  --font-type: "American Typewriter", "Courier Prime", "Courier New", Courier, monospace;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  /* Maße */
  --radius: 6px;
  --gap: 1.25rem;
  --max: 1120px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font: 1.0625rem/1.55 var(--font-body);
  background-color: var(--night);
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(255, 196, 110, .16), transparent 60%),
    repeating-linear-gradient(91deg, rgba(255, 255, 255, .014) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89deg, rgba(0, 0, 0, .10) 0 1px, transparent 1px 27px),
    linear-gradient(180deg, #1f140c, #120c08 75%);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #1a110a;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
/* Programmatisch fokussierte Überschriften und Meldungen sind nicht bedienbar:
   kein Fokusrahmen, Meldungen leuchten stattdessen kurz auf. */
h1:focus, h2:focus, [tabindex="-1"]:focus { outline: none; }
.success:focus { animation: pulseOk 1.2s ease-out; }
@keyframes pulseOk { from { box-shadow: 0 0 0 6px rgba(143, 194, 122, .45); } to { box-shadow: 0 0 0 0 rgba(143, 194, 122, 0); } }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 1rem; top: -4rem; z-index: 50; background: var(--brass); color: var(--ink); padding: .5rem 1rem; border-radius: var(--radius); }
.skip-link:focus { top: calc(env(safe-area-inset-top, 0px) + .5rem); }
#svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.muted { color: var(--text-dim); }
.parchment .muted, .hand-frame .muted, .hints .muted { color: var(--ink-soft); }
.small { font-size: .875rem; }
.noscript { padding: 2rem; text-align: center; }

/* ---------- Kopfleiste ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(26, 17, 10, .94);
  border-bottom: 1px solid var(--wood-line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
  backdrop-filter: blur(6px);
}
.topbar-inner {
  max-width: var(--max); margin: 0 auto;
  display: flex; align-items: center; gap: .75rem 1rem; flex-wrap: wrap;
  padding-block: .5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { font-family: var(--font-display); font-variant: small-caps; letter-spacing: .06em; color: var(--brass-hi); font-size: 1.05rem; white-space: nowrap; }
.progress { flex: 1 1 auto; min-width: 0; }
.progress-list { display: flex; gap: .35rem; justify-content: center; flex-wrap: wrap; }
.pg {
  position: relative; width: 2.35rem; height: 2.35rem; border-radius: 50%;
  border: 2px solid var(--wood-line); background: var(--wood);
  color: var(--text); cursor: pointer; padding: 0;
  display: grid; place-items: center; font: 600 .95rem var(--font-ui);
}
.pg .pg-name { display: none; }
.pg .pg-mark { position: absolute; right: -.3rem; bottom: -.3rem; font-size: .7rem; line-height: 1; }
.pg-open { border-color: var(--brass); }
.pg-done { background: var(--brass); color: var(--ink); border-color: var(--brass-hi); }
.pg-done .pg-mark { background: var(--ok-ink); color: #fff; border-radius: 50%; width: 1rem; height: 1rem; display: grid; place-items: center; }
.pg-locked { opacity: .55; cursor: not-allowed; }
.pg-current { box-shadow: 0 0 0 3px var(--night), 0 0 0 5px var(--brass-hi); }
.tools { display: flex; align-items: center; gap: .5rem; }
.timer { display: flex; align-items: center; gap: .25rem; font: 600 .95rem var(--font-ui); font-variant-numeric: tabular-nums; color: var(--text-dim); }
.timer.paused #timer-value { opacity: .6; }
.icon-btn {
  min-width: 2.5rem; min-height: 2.5rem; padding: .3rem .6rem; border-radius: var(--radius);
  background: transparent; border: 1px solid var(--wood-line); color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .35rem; font: .9rem var(--font-ui);
}
.icon-btn:hover { border-color: var(--brass); color: var(--brass-hi); }
.storage-warning { background: var(--bad-ink); color: #fff; text-align: center; padding: .35rem 1rem; font: .85rem var(--font-ui); }
@media (max-width: 720px) {
  .topbar { position: static; }
  .brand { display: none; }
  .icon-btn.labeled .btn-label { display: none; }
  .topbar-inner { gap: .5rem; }
  .pg { width: 2.1rem; height: 2.1rem; font-size: .85rem; }
}

/* ---------- Grundlayout ---------- */
main {
  display: block; max-width: var(--max); margin: 0 auto;
  padding-block: 1.5rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main:focus { outline: none; }
.station { display: grid; gap: var(--gap); }
.station > * { min-width: 0; }
.station-head { display: grid; gap: .35rem; padding-top: .5rem; }
.eyebrow { font: 600 .8rem var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.station-head h1 { font-size: clamp(1.7rem, 1.2rem + 2.2vw, 2.6rem); color: var(--text); }

/* ---------- Papier ---------- */
.parchment {
  background-color: var(--parchment);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, .45), transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(150, 110, 50, .22), transparent 60%);
  color: var(--ink);
  border-radius: 3px;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .45), inset 0 0 40px rgba(120, 80, 30, .25);
  padding: 1.1rem 1.3rem;
}
.story { display: grid; gap: .6rem; max-width: 70ch; font-size: 1.08rem; }
.story-small { font-size: 1rem; }
.story-intro { font-size: 1.12rem; }

/* ---------- Bedienelemente ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 2.75rem; padding: .55rem 1.15rem;
  border-radius: var(--radius); border: 1px solid var(--brass-deep);
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, var(--brass-deep));
  color: #22160b; font: 600 1rem var(--font-ui); cursor: pointer;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .45);
  text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0, 0, 0, .4); }
.btn:disabled { filter: grayscale(.7) brightness(.7); cursor: not-allowed; transform: none; }
.btn-ghost { background: rgba(255, 255, 255, .03); color: var(--text); border-color: var(--wood-line); box-shadow: none; }
.btn-ghost:hover { border-color: var(--brass); color: var(--brass-hi); filter: none; }
.parchment .btn-ghost, .hints .btn-ghost { color: var(--ink); border-color: var(--ink-soft); }
.btn-small { min-height: 2.4rem; padding: .35rem .8rem; font-size: .9rem; }
.btn-big { min-height: 3.2rem; padding: .7rem 1.8rem; font-size: 1.15rem; }
.btn-round { width: 3rem; height: 3rem; min-height: 0; padding: 0; border-radius: 50%; font-size: 1.45rem; }
.btn-danger { background: linear-gradient(180deg, #d26a52, #a8402c); border-color: #6e2416; color: #fff; }
.btn-block { width: 100%; }
.chip {
  min-height: 2.4rem; min-width: 2.6rem; padding: .25rem .7rem; border-radius: 999px;
  border: 1px solid var(--ink-soft); background: rgba(255, 255, 255, .55); color: var(--ink);
  font: 600 1rem var(--font-ui); cursor: pointer;
}
.chip:hover { background: #fff; }
.helper-row { display: flex; flex-wrap: wrap; gap: .4rem; }

/* ---------- Teilaufgaben ---------- */
.part {
  display: grid; gap: 1rem;
  background: linear-gradient(180deg, rgba(61, 39, 23, .92), rgba(43, 27, 17, .92));
  border: 1px solid var(--wood-line); border-radius: 10px;
  padding: 1.25rem clamp(1rem, 2.5vw, 1.75rem);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
}
.part > * { min-width: 0; }
.part.flash { animation: flashPart 1.6s ease-out; }
@keyframes flashPart { 0%, 30% { box-shadow: 0 0 0 4px var(--brass-hi), 0 12px 30px rgba(0, 0, 0, .35); } 100% { box-shadow: 0 12px 30px rgba(0, 0, 0, .35); } }
.part-title { font-size: clamp(1.25rem, 1.1rem + .8vw, 1.6rem); color: var(--brass-hi); }
.answer-form { display: grid; gap: .5rem; max-width: 36rem; }
.answer-label { font: 600 1.02rem var(--font-ui); color: var(--text); }
.parchment .answer-label { color: var(--ink); }
.answer-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.answer-prefix { font: 600 1.2rem var(--font-mono); }
.text-input {
  flex: 1 1 12rem; min-width: 0; min-height: 2.75rem;
  padding: .5rem .8rem; border-radius: var(--radius);
  border: 2px solid var(--brass-deep); background: #fbf5e6; color: var(--ink);
  font: 1.1rem var(--font-ui);
}
.text-input:disabled { background: #cfc4ab; border-color: #7d6a4c; opacity: .75; cursor: not-allowed; }
.is-solved .text-input:disabled { background: #e7dcc2; color: var(--ok-ink); border-color: var(--ok); font-weight: 700; opacity: 1; -webkit-text-fill-color: var(--ok-ink); cursor: default; }
.text-input.mono { font-family: var(--font-mono); letter-spacing: .12em; }
.text-input-short { flex: 0 0 5rem; text-align: center; }
.feedback { min-height: 1.5em; font: 600 .98rem var(--font-ui); }
.feedback:empty { min-height: 0; }
.fb-bad { color: var(--bad); }
.fb-ok { color: var(--ok); }
.fb-info { color: var(--text-dim); }
.parchment .fb-bad, .hand-frame .fb-bad { color: var(--bad-ink); }
.parchment .fb-info, .hand-frame .fb-info { color: var(--ink-soft); }
.success {
  display: flex; gap: .75rem; align-items: flex-start;
  background: rgba(143, 194, 122, .12); border: 1px solid rgba(143, 194, 122, .55); border-radius: var(--radius);
  padding: .75rem 1rem; color: var(--text);
}
.success > div { display: grid; gap: .4rem; }
.success-ico { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--ok); color: #13250c; display: grid; place-items: center; font-weight: 800; }
.parchment .success, .hand-frame .success { color: var(--ink); background: rgba(47, 90, 34, .1); border-color: var(--ok-ink); }
.note-box { border-left: 4px solid var(--brass); padding: .5rem .9rem; background: rgba(0, 0, 0, .2); border-radius: 0 var(--radius) var(--radius) 0; }
.note-box.ok { border-left-color: var(--ok); }
.nb-inline { font: .95rem var(--font-ui); color: var(--text-dim); }
.nb-inline-label { color: var(--brass-hi); font-weight: 600; }
.step { display: grid; gap: .5rem; }

/* ---------- Hinweise ---------- */
.hints {
  display: grid; gap: .6rem; max-width: 46rem;
  background: rgba(239, 227, 198, .92); color: var(--ink);
  border-radius: var(--radius); padding: .85rem 1rem;
  border: 1px dashed var(--ink-soft);
}
.hints-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; align-items: baseline; }
.hints-head h3 { font-size: 1.05rem; }
.hint-count { font: .82rem var(--font-ui); color: var(--ink-soft); }
.hint-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .4rem; }
.hint-list li { display: flex; gap: .5rem; font-family: var(--font-hand); font-size: 1.05rem; color: var(--wax); }
.hint-no { font-weight: 700; }
.hints .btn { justify-self: start; }

/* ---------- Ergänzende Wissenskästen ---------- */
.wissen {
  display: grid; gap: .45rem; max-width: 70ch;
  border: 1px solid #6f8fc7; border-radius: var(--radius);
  background: rgba(36, 81, 155, .16); padding: .8rem 1rem; font-size: .98rem;
}
.wissen-label { font: 700 .78rem var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: #a9c4f5; }
.formula { font: 1.05rem var(--font-mono); }
.calc { margin: 0; padding-left: 1.4rem; font-family: var(--font-mono); }

/* ---------- Zahlenschloss ---------- */
.lock-wrap { display: grid; gap: .5rem; justify-items: start; }
.lock {
  display: grid; gap: .75rem; justify-items: center;
  padding: 1rem 1.25rem; border-radius: 14px;
  background: linear-gradient(160deg, #8b8f94, #55595e 55%, #3a3d41);
  border: 2px solid #2a2c2f; box-shadow: 0 10px 24px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .3);
  max-width: 100%;
}
.lock-title { font: 600 .82rem var(--font-ui); color: #f1f1f1; letter-spacing: .06em; text-transform: uppercase; text-align: center; }
.wheels { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; }
.wheel { display: grid; justify-items: center; gap: .15rem; }
.wheel-btn {
  width: 2.75rem; height: 2rem; border-radius: 6px; border: 1px solid #222; cursor: pointer;
  background: linear-gradient(#5d6166, #3b3e42); color: #eee; font-size: .8rem;
}
.wheel-btn:disabled { opacity: .5; cursor: default; }
.wheel-digit {
  width: 2.75rem; height: 3.4rem; display: grid; place-items: center; border-radius: 6px;
  background: linear-gradient(180deg, #1e1a14 0%, #4a3f2f 22%, #e9dcc0 45%, #f6ecd5 52%, #e0d0ad 60%, #4a3f2f 80%, #1e1a14 100%);
  color: #1c140a; font: 700 1.7rem var(--font-mono); border: 1px solid #111; cursor: ns-resize;
  font-variant-numeric: tabular-nums;
}
.wheel-digit.roll { animation: roll .18s ease-out; }
@keyframes roll { from { transform: translateY(-6px); opacity: .5; } to { transform: none; opacity: 1; } }
.wheel-label { display: grid; justify-items: center; font: 700 1rem var(--font-ui); color: #fff; }
.wheel-label .body-icon { width: 2.2rem; height: 2.2rem; }
.lock-open { min-width: 10rem; }
.lock.is-open { background: linear-gradient(160deg, #a7c497, #5f7d52 55%, #3e5636); }
.lock-help { margin-top: -.15rem; }

/* ---------- Türen ---------- */
.station-nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; }
.door {
  display: flex; align-items: center; gap: .8rem; text-align: left;
  min-height: 3.6rem; padding: .6rem 1.1rem; border-radius: 10px 10px 4px 4px;
  background: linear-gradient(180deg, #5b3a20, #3a2414); border: 2px solid var(--wood-line);
  color: var(--text); cursor: pointer; flex: 1 1 15rem; max-width: 28rem;
}
.door-open { border-color: var(--brass); }
.door-open:hover { background: linear-gradient(180deg, #6b4526, #44291a); }
.door-locked { opacity: .6; cursor: not-allowed; }
.door-secondary { flex-grow: 0; }
.door-ico { font-size: 1.4rem; }
.door-text { display: grid; }
.door-text strong { font: 600 1rem var(--font-ui); }
.door-text small { color: var(--text-dim); font: .85rem var(--font-ui); }
.door-final { max-width: none; background: linear-gradient(180deg, #7a5a1f, #4a3410); }

/* ---------- Szenen ---------- */
.scene { display: grid; gap: .75rem; }
.scene-box { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--wood-line); box-shadow: 0 14px 34px rgba(0, 0, 0, .5); background: #000; }
.scene-svg { display: block; width: 100%; height: auto; }
.scene-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.scene-help, .scene-caption { color: var(--text-dim); font: .92rem var(--font-ui); }
.scene-caption { font-family: var(--font-hand); font-size: 1.05rem; color: var(--text); }
.hotspot {
  position: absolute; background: transparent; border: 2px dashed transparent; border-radius: 10px; cursor: zoom-in; padding: 0;
}
.hotspot:hover, .hotspot:focus-visible { border-color: rgba(255, 211, 107, .85); background: rgba(255, 211, 107, .08); }
@media (max-width: 560px) { .hotspot-chip { display: none; } .hotspot { border-color: rgba(255, 211, 107, .35); } }
.hotspot-chip {
  position: absolute; right: .35rem; top: .35rem;
  background: rgba(20, 13, 8, .82); color: var(--brass-hi); border: 1px solid var(--brass-deep);
  font: 600 .75rem var(--font-ui); padding: .1rem .45rem; border-radius: 999px; white-space: nowrap;
}

/* ---------- Station 1: Tisch, Scheiben, Schlüssel ---------- */
.table-top {
  border-radius: 12px; padding: 1.25rem;
  background:
    repeating-linear-gradient(2deg, rgba(0, 0, 0, .08) 0 2px, transparent 2px 17px),
    linear-gradient(180deg, #6a4325, #4a2d17);
  border: 1px solid #7a5230; box-shadow: inset 0 0 60px rgba(0, 0, 0, .45), 0 14px 34px rgba(0, 0, 0, .45);
}
.s1-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .75fr) minmax(0, 1fr); gap: 1rem; align-items: center; }
.s1-grid > * { min-width: 0; }
@media (max-width: 860px) { .s1-grid { grid-template-columns: minmax(0, 1fr); } }
.disc-block { margin: 0; display: grid; gap: .6rem; justify-items: center; }
.disc-block figcaption { font: 600 1rem var(--font-ui); color: var(--text); text-align: center; }
.disc-block figcaption small { color: var(--text-dim); font-weight: 400; }
.disc-no { color: var(--brass-hi); font-family: var(--font-hand); font-size: 1.2rem; }
.disc-wrap { width: 100%; max-width: 340px; }
.octo-disc, .wheel-svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.disc-shadow { fill: rgba(0, 0, 0, .35); transform: translate(4px, 7px); }
.ring-fixed { fill: #f1e7cf; }
.ring-moving { fill: #e6d2a4; }
.octo-disc .moving, .wheel-svg .moving { cursor: grab; }
.octo-disc .moving.dragging, .wheel-svg .moving.dragging { cursor: grabbing; }
.sector { stroke: #2a1c10; stroke-width: 2.2; }
.edge { fill: none; stroke: #2a1c10; stroke-width: 2.6; }
.hub { fill: #f7f0de; stroke: #2a1c10; stroke-width: 2.6; }
.hub-white { fill: #fff; }
.hub-text { font: 700 22px var(--font-hand); fill: #2a1c10; dominant-baseline: central; text-anchor: middle; }
.lbl { font: 700 30px var(--font-hand); fill: #2a1c10; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.grip { fill: #8a6420; opacity: .55; }
.disc-controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: center; }

.keys-block { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem .75rem; justify-items: center; max-width: 300px; margin: 0 auto; }
.key-btn {
  position: relative; width: 100%; max-width: 128px; padding: .3rem .3rem .2rem; border-radius: 10px; cursor: pointer;
  background: rgba(0, 0, 0, .12); border: 2px solid transparent; color: var(--text);
}
.key-btn:nth-child(3), .key-btn:nth-child(4) { margin-top: -.5rem; }
.key-btn:hover { border-color: rgba(236, 198, 109, .6); background: rgba(0, 0, 0, .2); }
.key-btn.chosen { border-color: var(--ok); background: rgba(143, 194, 122, .15); }
.key-no {
  position: absolute; left: .1rem; top: 2.6rem; width: 1.7rem; height: 1.7rem; border-radius: 50%;
  border: 2px solid var(--text); display: grid; place-items: center; font: 700 .9rem var(--font-ui);
}
.key-svg { display: block; width: 100%; height: auto; }
.key-string { fill: none; stroke: #2a1c10; stroke-width: 2.2; }
.key-tag { fill: #fbf6ea; stroke: #2a1c10; stroke-width: 2; }
.key-tag-hole { fill: #fff; stroke: #2a1c10; stroke-width: 1.6; }
.key-tag-text { font: 700 21px var(--font-hand); fill: #2a1c10; text-anchor: middle; letter-spacing: .04em; }

/* ---------- Station 2: Truhe ---------- */
.crack { fill: none; stroke: #6d6148; stroke-width: 2; opacity: .6; }
.r-num { font: 600 44px var(--font-display); fill: #4b3f2e; text-anchor: middle; opacity: .85; }
.r-val { font: 20px var(--font-display); fill: #4b3f2e; text-anchor: middle; opacity: .8; }
.chest-text { font: 600 17px var(--font-display); fill: #d8b46a; text-anchor: middle; }
.chest-text.small { font-size: 15px; }
.slip-text { font: 700 22px var(--font-hand); fill: #2a1c10; text-anchor: middle; }
.lid-open.anim { animation: lidOpen .9s ease-out both; }
@keyframes lidOpen { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.wall-detail { background: linear-gradient(180deg, #bdb092, #9c8e70); border-radius: 8px; padding: clamp(1rem, 4vw, 2.5rem); }
.wall-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; }
@media (max-width: 560px) { .wall-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 1.25rem; } }
.wall-cell { display: grid; justify-items: center; gap: .3rem; color: #3b3022; }
.wall-sym { font: 600 clamp(2rem, 1.4rem + 3vw, 3.4rem) var(--font-display); text-shadow: 0 1px 0 rgba(255, 255, 255, .35); }
.wall-val { font: 1.1rem var(--font-display); }
.chest-detail {
  display: grid; gap: 1.25rem; justify-items: center; text-align: center;
  background: linear-gradient(180deg, #3c2b1d, #22170e); border: 4px solid #5e4a2e; border-radius: 10px;
  padding: clamp(1rem, 4vw, 2.5rem); color: #e2c27b; font-family: var(--font-display);
}
.chest-line { font-size: clamp(1.15rem, 1rem + 1vw, 1.6rem); line-height: 1.5; }
.chest-line.top { border-bottom: 2px solid #6d5634; padding-bottom: .75rem; width: 100%; }
.chest-lock { display: flex; gap: .3rem; padding: .5rem .7rem; background: #6c7075; border-radius: 8px; }
.chest-lock span { width: 1.1rem; height: 1.9rem; background: #3b2e1f; border-radius: 3px; }

/* ---------- Station 3: Bücher ---------- */
.book {
  padding: clamp(.6rem, 2vw, 1.1rem); border-radius: 10px;
  background: #23382a; box-shadow: 0 18px 40px rgba(0, 0, 0, .6), inset 0 0 0 2px #1a2a1f;
}
.book-inner { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 680px) { .book-inner { grid-template-columns: 1fr; } }
.page {
  position: relative; min-height: 20rem; padding: 1.6rem 1.4rem 3rem; color: var(--ink);
  background-color: #efe2c2;
  background-image: radial-gradient(ellipse at 50% 40%, rgba(255, 255, 255, .35), transparent 70%);
}
.page-left { box-shadow: inset -22px 0 30px -18px rgba(70, 45, 15, .55); border-radius: 4px 0 0 4px; }
.page-right { box-shadow: inset 22px 0 30px -18px rgba(70, 45, 15, .55); border-radius: 0 4px 4px 0; }
@media (max-width: 680px) {
  .page-left { border-radius: 4px 4px 0 0; box-shadow: inset 0 -16px 24px -18px rgba(70, 45, 15, .55); }
  .page-right { border-radius: 0 0 4px 4px; box-shadow: inset 0 16px 24px -18px rgba(70, 45, 15, .55); min-height: 12rem; }
}
.page-content { display: grid; gap: .75rem; }
.page-no { position: absolute; bottom: .9rem; font: 600 1rem var(--font-body); color: var(--ink); letter-spacing: .04em; }
.page-no-left { left: 1.4rem; }
.page-no-right { right: 1.4rem; }
.book-type { font: 1.32rem/1.35 var(--font-type); text-align: center; }
.book-small { font-size: .98rem; line-height: 1.5; }
.book-q { margin-top: .5rem; }
.hand { font-family: var(--font-hand); font-size: 1.12rem; display: grid; gap: .3rem; }
.hand.red { color: var(--wax); }
.hand.blue { color: var(--blue-ink); }

/* ---------- Station 4: Gedicht, Pinnwand, Zahlenrad ---------- */
.s4-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }
.s4-top .poem { justify-self: start; max-width: 40rem; }
.poem-title { font-style: italic; font-size: 1.25rem; margin-bottom: .6rem; }
.poem-lines { font-size: 1.05rem; line-height: 1.7; }
.pinboard { margin: 0; display: grid; gap: .6rem; }
.pinboard-frame {
  border: 14px solid #5c3a1d; border-radius: 6px; background: #b37d4b;
  box-shadow: 0 16px 36px rgba(0, 0, 0, .55), inset 0 0 0 2px #3b230f;
}
.pinboard.moved .pinboard-frame { transform: rotate(-1.2deg); }
.pinboard.anim .pinboard-frame { animation: lift .8s ease-out; }
@keyframes lift { 0% { transform: none; } 40% { transform: translate(-3%, -4%) rotate(-3deg); } 100% { transform: rotate(-1.2deg); } }
.pinboard-svg { display: block; width: 100%; height: auto; }
.note-light { fill: #f6efd4; }
.note-blue { fill: #c7dbe9; }
.note-pink { fill: #efbcd4; }
.pb-text { font: 700 44px var(--font-hand); fill: #1d1d1d; text-anchor: middle; }
.pb-string { fill: none; stroke: #8f1d2c; stroke-width: 4.5; stroke-linecap: round; }
.pb-string-shadow { fill: none; stroke: rgba(0, 0, 0, .28); stroke-width: 5; stroke-linecap: round; }
.pb-knot { fill: none; stroke: #8f1d2c; stroke-width: 4; }
.wheel-part.reveal { animation: reveal .9s ease-out; }
@keyframes reveal { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
.wheel-layout { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 1.5rem; align-items: center; }
@media (max-width: 760px) { .wheel-layout { grid-template-columns: minmax(0, 1fr); } }
.wheel-wrap { max-width: 360px; }
.w-outer { font: 700 21px var(--font-ui); fill: #1d1d1d; text-anchor: middle; dominant-baseline: central; }
.w-inner { font: 600 19px var(--font-ui); fill: #6b6b6b; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.w-digit { font: 600 12px var(--font-ui); fill: #8a8a8a; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.w-tick { stroke: #2a1c10; stroke-width: 1.4; }
.w-tick-in { stroke: #b8a985; }
.w-inner-ring { fill: #f7f3e8; }
.wheel-svg .ring-fixed { fill: #fbf8ef; }
.w-mark { fill: none; stroke: #b3261e; stroke-width: 3.5; }
.wheel-side { display: grid; gap: .6rem; justify-items: start; }
.digit-notes { display: flex; gap: .4rem; }
.digit-note {
  width: 2.75rem; height: 3.1rem; text-align: center; border-radius: 6px; border: 2px solid var(--brass-deep);
  background: #fbf5e6; color: var(--ink); font: 700 1.5rem var(--font-hand);
}

/* ---------- Station 5: Schreibtisch ---------- */
.desk-mini { font: 700 11px var(--font-ui); fill: #2a1c10; text-anchor: middle; }
.desk-ruler { font: 600 11px var(--font-ui); fill: #2a1c10; text-anchor: middle; }
.body-letter { font: 700 15px var(--font-ui); fill: #fff; text-anchor: middle; }
.body-letter.big { font-size: 18px; }
.s5a-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 680px) { .s5a-layout { grid-template-columns: minmax(0, 1fr); } }
.eq-note {
  background: #b89a6e; color: #1d140a; border-radius: 22px 14px 26px 12px; padding: 1.25rem 1.75rem;
  display: grid; gap: .55rem; box-shadow: 0 10px 24px rgba(0, 0, 0, .45); max-width: 22rem;
}
.eq { font: 1.6rem var(--font-hand); letter-spacing: .04em; }
.eq-key { margin-top: .5rem; }
.eq-key-ico { font-size: 1.3rem; }
.bodies { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.body-item { display: flex; align-items: center; gap: .75rem; font: 1rem var(--font-ui); }
.body-item .body-icon { width: 3rem; height: 3rem; flex: none; }
.dlg-body .body-item { color: var(--text); }
.small-note { max-width: 62ch; }
.small-note-label { font: 700 .78rem var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: .35rem; }
.hand-ink { font-family: var(--font-hand); font-size: 1.05rem; line-height: 1.6; }
.rod-puzzle { display: grid; gap: .75rem; justify-items: start; }
.rod-frame { width: 100%; background: linear-gradient(180deg, #3a2618, #24170e); border-radius: 10px; border: 1px solid var(--wood-line); padding: .5rem; }
.rod-svg { display: block; width: 100%; height: auto; overflow: visible; }
.rod-bar { fill: #ecdcae; stroke: #2a1c10; stroke-width: 3; }
.rod-num { font: 700 26px var(--font-hand); fill: #2a1c10; text-anchor: middle; }
.rod-hook { fill: none; stroke: #d6c08c; stroke-width: 3; }
.rod-string { stroke: #d6c08c; stroke-width: 3; }
.rod-wlabel { font: 800 24px var(--font-ui); fill: #2a1c10; text-anchor: middle; }
.fulcrum { cursor: ew-resize; touch-action: none; }
.fulcrum:focus { outline: none; }
.fulcrum:focus-visible .fulcrum-wedge { stroke: var(--focus); stroke-width: 5; }
.fulcrum-wedge { fill: #2b2b2b; stroke: #e7d3a0; stroke-width: 2.5; }
.fulcrum-post { fill: #6b5a45; stroke: #2a1c10; stroke-width: 1.5; }
.fulcrum.dragging .fulcrum-wedge { fill: #3a2a12; }
.rod-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.rod-label { font: 600 1rem var(--font-ui); }

/* ---------- Station 6: Cantor ---------- */
.wall-inscription {
  text-align: center; padding: 1.5rem 1rem; border-radius: 10px;
  font: italic 600 clamp(1.4rem, 1rem + 2.4vw, 2.4rem) var(--font-display);
  color: #f6e3b0; letter-spacing: .02em;
  background: radial-gradient(ellipse at 50% 50%, rgba(255, 210, 120, .18), transparent 70%), #2a2219;
  border: 1px solid var(--wood-line); text-shadow: 0 0 18px rgba(255, 200, 100, .35);
}
.footnotes { font-size: .85rem; margin: .5rem 0 0; padding-left: 1.2rem; }
.hand-frame {
  background: var(--parchment); color: var(--ink);
  border: 3px solid #a8832f; border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  padding: 1.25rem 1.5rem; box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
}
.mapping { display: grid; gap: .3rem; justify-self: start; min-width: 12rem; font: 1.6rem var(--font-hand); }
.map-row { display: grid; grid-template-columns: 2.5rem 2rem 2.5rem; text-align: center; }
.map-arrow { color: var(--ink-soft); }
.dragon-scene {
  position: relative; overflow: hidden; border-radius: 10px; min-height: 17rem;
  background: radial-gradient(ellipse at 70% 40%, #5a2412, #1b0d08 60%, #0c0604);
  border: 1px solid #4a1d10; display: grid; align-items: end;
}
.dragon-stage { position: absolute; inset: 0; display: grid; place-items: start center; padding-top: .5rem; }
.dragon-svg { width: min(440px, 76%); height: auto; animation: dragonFly 7s ease-in-out infinite; }
.dragon-body path { fill: #050302; }
.dragon-eye { fill: #ffb347; filter: drop-shadow(0 0 6px #ff8a00); animation: blink 4s infinite; }
@keyframes dragonFly { 0%, 100% { transform: translate(6%, 4%) scale(.96); } 50% { transform: translate(-6%, -3%) scale(1.03); } }
@keyframes blink { 0%, 92%, 100% { opacity: 1; } 95% { opacity: .1; } }
.dragon-scene::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 100%, rgba(255, 120, 40, .25), transparent 60%); animation: flicker 2.2s infinite alternate; pointer-events: none; }
@keyframes flicker { from { opacity: .4; } to { opacity: 1; } }
.dragon-text { position: relative; z-index: 1; margin: 1rem; padding: .7rem 1rem; background: rgba(12, 6, 4, .78); border-radius: var(--radius); font: italic 1.1rem var(--font-body); color: #f6dcc0; }
.dragon-scene.escaped .dragon-svg { animation: dragonAway 2s ease-in forwards; }
@keyframes dragonAway { to { transform: translate(-60%, -30%) scale(.5); opacity: .25; } }
.door-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
@media (max-width: 820px) { .door-layout { grid-template-columns: minmax(0, 1fr); } }
.door-note { display: grid; gap: .6rem; font: 1.08rem/1.5 var(--font-hand); }
.cantor-drawing { background: #fbf7ec; border-radius: 6px; padding: .25rem; }
.cantor-svg { display: block; width: 100%; height: auto; }
.cq-line { stroke: #2a1c10; stroke-width: 3; }
.cq-dash { fill: none; stroke: #2a1c10; stroke-width: 2.2; stroke-dasharray: 8 7; }
.cq-point { fill: var(--wax); }
.cq-lbl { font: 22px var(--font-hand); fill: #2a1c10; text-anchor: middle; }
.signature { text-align: right; font-style: italic; }
.cantor-info .answer-label { font: 600 1rem var(--font-ui); color: var(--brass-hi); margin-top: .3rem; }
.cantor-info { display: grid; gap: .45rem; background: rgba(0, 0, 0, .2); border-radius: 8px; padding: 1rem; }
.info-label { font: 600 1rem var(--font-ui); color: var(--brass-hi); margin-top: .3rem; }
.mono { font: 1.12rem var(--font-mono); }
.tip { font-style: italic; color: var(--text-dim); }

/* ---------- Station 7: Tafel ---------- */
.task { font: italic 1.12rem var(--font-body); color: var(--text); }
.board { margin: 0; display: grid; gap: .6rem; }
.board-svg { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 16px 36px rgba(0, 0, 0, .55); }
.chalk { font: 46px var(--font-hand); fill: #f3f1e7; opacity: .92; text-anchor: middle; }
.chalk-title { font-size: 34px; letter-spacing: .03em; }
.chalk-mark path { fill: none; stroke: #f3f1e7; stroke-width: 3.6; stroke-linecap: round; opacity: .85; }
.chalk-mark circle { fill: #f3f1e7; opacity: .7; }

/* ---------- Station 8: Gödel ---------- */
.console-glow { animation: glow 2.4s infinite alternate; }
@keyframes glow { from { opacity: .7; } to { opacity: 1; } }
.safe-key { font: 700 16px var(--font-mono); fill: #ddd; text-anchor: middle; }
.goedel-note { display: grid; gap: .8rem; font-family: var(--font-hand); font-size: 1.05rem; }
.goedel-note .lead { font-size: 1.15rem; }
.note-infos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: .5rem 1.5rem; }
@media (max-width: 680px) { .note-infos { grid-template-columns: minmax(0, 1fr); } }
.indent { padding-left: 3.6rem; }
.example { font-size: .98rem; }
.truth-wrap { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: flex-start; overflow-x: auto; }
.truth { border-collapse: collapse; font: 1.05rem var(--font-ui); }
.truth caption { text-align: left; font: 600 1rem var(--font-hand); padding-bottom: .3rem; }
.truth th, .truth td { padding: .3rem .6rem; text-align: center; border-bottom: 1px solid var(--ink-soft); }
.truth thead th { border-bottom: 2px solid var(--ink); }
.truth td:nth-child(4), .truth th:nth-child(4) { border-left: 2px solid var(--ink); }
.truth-small td:nth-child(3), .truth-small th:nth-child(3) { border-left: 2px solid var(--ink); }
.code-no { color: var(--blue-ink); font-family: var(--font-hand); }
.truth-in {
  width: 2.4rem; height: 2.4rem; text-align: center; border-radius: 4px; border: 1.5px solid var(--ink-soft);
  background: #fffdf6; color: var(--wax); font: 700 1.2rem var(--font-hand);
}
.binary-form { max-width: 34rem; }
.keypad { display: flex; gap: .4rem; }
.keypad-btn {
  width: 3.2rem; height: 2.8rem; border-radius: 6px; border: 1px solid #222; cursor: pointer;
  background: linear-gradient(#5d6166, #33363a); color: #f1f1f1; font: 700 1.2rem var(--font-mono);
}
.keypad-btn:disabled { opacity: .5; cursor: default; }
.letter { display: grid; gap: .8rem; max-width: 44rem; font-family: var(--font-hand); font-size: 1.08rem; }
.letter-head { font: italic 600 1.2rem var(--font-display); text-align: center; border-bottom: 1px solid var(--ink-soft); padding-bottom: .5rem; }
.statement { font-size: 1.3rem; text-align: center; }
.letter-form { display: grid; gap: .8rem; }
.choice-set { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .6rem 2rem; }
.choice-set legend { font: 600 .95rem var(--font-ui); margin-bottom: .4rem; }
.choice { display: flex; align-items: center; gap: .5rem; }
.choice input { width: 1.4rem; height: 1.4rem; accent-color: var(--wax); }
.choice label { cursor: pointer; }
.letter .btn { justify-self: start; }
.letter-questions { display: grid; gap: .3rem; text-align: center; }
.console {
  display: grid; gap: .9rem; border-radius: 12px; padding: 1.25rem;
  background: radial-gradient(ellipse at 50% 0%, #17302a, var(--console) 70%); color: var(--console-text);
  border: 3px solid #2b3a35; box-shadow: inset 0 0 40px rgba(0, 0, 0, .7), 0 12px 30px rgba(0, 0, 0, .5);
  font-family: var(--font-mono);
}
.console-statement { font-size: 1.25rem; text-align: center; color: #d8fff0; }
.console-task { text-align: center; }
.mc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.mc-btn {
  display: flex; align-items: center; gap: .6rem; text-align: left; min-height: 3rem; padding: .5rem .75rem;
  border-radius: 8px; border: 2px solid #3d6f60; background: #10231e; color: var(--console-text); cursor: pointer; font: .98rem var(--font-ui);
}
.mc-btn:hover { border-color: #6fd1ad; }
.mc-btn.on { background: #1f4a3d; border-color: #9fe3c4; color: #fff; }
.mc-box { flex: none; width: 1.4rem; height: 1.4rem; border: 2px solid currentColor; border-radius: 3px; display: grid; place-items: center; font-weight: 800; color: var(--bad); }
.mc-btn.on .mc-box { color: #ff9b85; }
.btn-console { justify-self: center; background: linear-gradient(180deg, #7fe0b9, #3f9e7a); border-color: #1f5c46; color: #062016; }
.console .fb-bad { color: #ffb39f; }

/* ---------- Start- und Abschlussseite ---------- */
.start, .finale { display: grid; gap: 1.5rem; }
.start > *, .finale > * { min-width: 0; }
.hero { text-align: center; display: grid; gap: .5rem; padding: clamp(1.5rem, 6vw, 4rem) 0 .5rem; }
.hero h1 { font-size: clamp(2.2rem, 1.2rem + 5vw, 4.2rem); color: #f6e3b0; letter-spacing: .01em; text-shadow: 0 0 30px rgba(255, 190, 90, .25); }
.hero-sub { font: italic 1.3rem var(--font-display); color: var(--brass-hi); }
.story-intro { justify-self: center; }
.start-actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
.panel { background: rgba(43, 27, 17, .9); border: 1px solid var(--wood-line); border-radius: 10px; padding: 1.25rem 1.5rem; display: grid; gap: .75rem; }
.rules { max-width: 46rem; justify-self: center; width: 100%; }
.rules h2, .credits h2 { font-size: 1.3rem; color: var(--brass-hi); }
.rules ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .4rem; }
.credits { text-align: center; display: grid; gap: .5rem; color: var(--text-dim); padding: 1rem 0; border-top: 1px solid var(--wood-line); }
.team { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; justify-content: center; color: var(--text); }
.role { color: var(--text-dim); }
.manuscript {
  justify-self: center; width: 12rem; height: 15rem; border-radius: 4px 12px 12px 4px;
  background: linear-gradient(90deg, #6e1f17 0 12%, #8e2a1f 12% 100%); box-shadow: 0 0 60px rgba(255, 200, 110, .35), 0 18px 40px rgba(0, 0, 0, .6);
  display: grid; place-items: center; color: #f3d48a; font: 5rem var(--font-display);
  animation: glowBook 3s ease-in-out infinite alternate;
}
@keyframes glowBook { from { box-shadow: 0 0 30px rgba(255, 200, 110, .25), 0 18px 40px rgba(0, 0, 0, .6); } to { box-shadow: 0 0 80px rgba(255, 200, 110, .5), 0 18px 40px rgba(0, 0, 0, .6); } }
.stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin: 0; }
.stats > div { background: rgba(43, 27, 17, .9); border: 1px solid var(--wood-line); border-radius: 10px; padding: .75rem 1.25rem; text-align: center; min-width: 9rem; }
.stats dt { font: 600 .78rem var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); }

    var digitsEls = [];
    function store() { state.drafts[key] = vals.join(''); saveSoon(); }
    function setVal(i, v) {
      vals[i] = L.mod(v, 10);

  /* =================== 7. Drehscheiben =================== */
  function RotDisc(svg, opts) {
    this.svg = svg; this.n = opts.n; this.deg = 360 / opts.n;
    this.steps = L.mod(opts.steps || 0, opts.n);
    this.angle = this.steps * this.deg; this.visual = this.angle;
    this.onChange = opts.onChange;
    this.group = svg.querySelector('.moving');
    this.labels = opts.upright ? Array.prototype.slice.call(this.group.querySelectorAll('[data-cx]')) : [];
    this.raf = 0;
    this.apply(this.angle);
    this.bindDrag();
  }
  RotDisc.prototype.apply = function (a) {
    this.visual = a;
    this.group.setAttribute('transform', 'rotate(' + a.toFixed(3) + ')');
    this.labels.forEach(function (t) { t.setAttribute('transform', 'rotate(' + (-a).toFixed(3) + ' ' + t.getAttribute('data-cx') + ' ' + t.getAttribute('data-cy') + ')'); });
  };
  RotDisc.prototype.animateTo = function (target) {
    var self = this;
    cancelAnimationFrame(this.raf);
    var from = this.visual; this.angle = target;
    if (REDUCED) { this.apply(target); return; }
    var t0 = performance.now(), dur = 240;
    function tick(now) {
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      self.apply(from + (target - from) * e);
      if (k < 1) self.raf = requestAnimationFrame(tick);
    }
    this.raf = requestAnimationFrame(tick);
  };
  RotDisc.prototype.rotateBy = function (k) {
    this.steps = L.mod(this.steps + k, this.n);
    this.animateTo(this.angle + k * this.deg);
    this.onChange(this.steps);
  };
  RotDisc.prototype.reset = function () {
    var k = -this.steps;
    if (k < -this.n / 2) k += this.n;
    if (k) this.rotateBy(k);
  };
  RotDisc.prototype.bindDrag = function () {
    var self = this, g = this.group, active = null;
    function angleAt(e) {
      var r = self.svg.getBoundingClientRect();
      return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
    }
    g.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      cancelAnimationFrame(self.raf); self.apply(self.angle);
      active = { id: e.pointerId, last: angleAt(e), acc: 0, base: self.angle };
      try { g.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
      g.classList.add('dragging');
      e.preventDefault();
    });
    g.addEventListener('pointermove', function (e) {
      if (!active || e.pointerId !== active.id) return;
      var a = angleAt(e), d = a - active.last;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      active.acc += d; active.last = a;
      self.apply(active.base + active.acc);
    });
    function end(e) {
      if (!active || e.pointerId !== active.id) return;
      var k = Math.round(active.acc / self.deg);
      active = null; g.classList.remove('dragging');
      if (k) self.rotateBy(k); else self.animateTo(self.angle);
    }
    g.addEventListener('pointerup', end);
    g.addEventListener('pointercancel', end);
  };

    return art;
  };

  /* ---------- Station 8: Gödel ---------- */
  RENDER[8] = function (st) {
    var art = shell(st);
    art.append(story(st.displayStory));
    var sceneBox = el('div', { class: 'scene-box' }, svgFrom(room8SVG(isSolved('s8.a'), isSolved('s8.c'))));
    hotspots(sceneBox, [
      { x: 29, y: 37, w: 17, h: 9, short: 'Zettel', label: 'Zettel auf dem Tresor lesen', action: function () { scrollToNode($('#part-s8-a')); } },
      { x: 23, y: 46, w: 28, h: 38, short: 'Tresor', label: 'Tresor ansehen', action: function () { scrollToNode(isSolved('s8.a') ? $('#part-s8-b') : $('#s8-code')); } },
      { x: 86, y: 41, w: 9, h: 22, short: 'Konsole', label: 'Konsole an der Tür ansehen', action: function () {
        if (available('s8.c')) scrollToNode($('#part-s8-c'));
        else setFeedback($('#room8-fb'), 'info', 'Die Konsole an der Tür zeigt nur: GESPERRT.');
      } }
    ]);
    art.append(el('section', { class: 'scene', 'aria-label': 'Der leere Raum' }, sceneBox, el('p', { class: 'feedback', id: 'room8-fb', role: 'status', 'aria-live': 'polite' })));

    /* A: Zettel und Tresor */
    var n = st.note;
    var secA = partSection('s8.a', 'Der Zettel auf dem Tresor');
    var tbl1 = el('table', { class: 'truth' },
      el('caption', {}, n.table1Title),
      el('thead', {}, el('tr', {}, el('th', { scope: 'col' }, 'Code-Nr.'), el('th', { scope: 'col' }, 'a'), el('th', { scope: 'col' }, 'b'), el('th', { scope: 'col' }, 'a und b'), el('th', { scope: 'col' }, 'a oder b'))),
      el('tbody', {}, n.table1.map(function (r) {
        return el('tr', {}, el('th', { scope: 'row', class: 'code-no' }, String(r.no)), el('td', {}, String(r.a)), el('td', {}, String(r.b)),
          el('td', {}, truthInput('r' + r.no + 'and', 'Code-Nr. ' + r.no + ': a und b')), el('td', {}, truthInput('r' + r.no + 'or', 'Code-Nr. ' + r.no + ': a oder b')));
      })));
    var tbl2 = el('table', { class: 'truth truth-small' },
      el('caption', {}, n.table2Title),
      el('thead', {}, el('tr', {}, el('th', { scope: 'col' }, 'Code-Nr.'), el('th', { scope: 'col' }, 'a'), el('th', { scope: 'col' }, '¬ a'))),
      el('tbody', {}, n.table2.map(function (r) {
        return el('tr', {}, el('th', { scope: 'row', class: 'code-no' }, String(r.no)), el('td', {}, String(r.a)), el('td', {}, truthInput('r' + r.no + 'not', 'Code-Nr. ' + r.no + ': nicht a')));
      })));
    var noteBox = el('div', { class: 'hand-frame goedel-note' },
      el('p', { class: 'lead' }, n.intro),
      el('div', { class: 'note-infos' },
        el('div', {}, el('p', {}, el('strong', {}, 'Infos: '), n.infos[0]), el('p', { class: 'indent' }, n.infos[1]), el('p', {}, n.values)),
        el('p', { class: 'example' }, n.example)),
      el('div', { class: 'truth-wrap' }, tbl1, el('div', {}, tbl2, el('p', { class: 'small' }, '(' + n.notExplained + ')'))),
      el('p', { class: 'muted small' }, 'Die Tabellenfelder sind eure Arbeitsfläche. Sie werden nicht geprüft.'),
      el('p', { class: 'lead' }, n.task),
      el('p', {}, '(Tipp: ' + n.tip + ')'));
    secA.append(noteBox);
    secA.append(binaryForm(n));
    if (isSolved('s8.a')) secA.append(successMsg('s8.a', 'Der Tresor öffnet sich mit einem tiefen Klacken. Darin liegt ein Brief.'));
    art.append(secA);

    /* B: Brief */
    if (isSolved('s8.a')) {
      var lt = st.letter;
      var secB = partSection('s8.b', 'Der Brief');
      secB.append(el('p', { class: 'task' }, lt.transition));
      var letter = el('div', { class: 'parchment letter' },
        el('p', { class: 'letter-head' }, 'Grundlagenkrise der Mathematik'),
        el('p', {}, lt.opening),
        el('p', { class: 'statement' }, lt.statement));
      var solvedB = isSolved('s8.b');
      var fs = el('fieldset', { class: 'choice-set' }, el('legend', {}, 'Welche Antwort trifft zu?'));
      lt.options.forEach(function (o) {
        var id = 'letter-' + o.id;
        var r = el('input', { type: 'radio', name: 'letter-choice', id: id, value: o.id, disabled: solvedB });
        r.checked = solvedB ? o.id === 'broken' : state.letterChoice === o.id;
        r.addEventListener('change', function () { state.letterChoice = o.id; saveSoon(); });
        fs.append(el('div', { class: 'choice' }, r, el('label', { for: id }, o.label)));
      });
      var fbB = el('p', { class: 'feedback', role: 'status', 'aria-live': 'polite' });
      var form = el('form', { class: 'letter-form', novalidate: true }, fs,
        el('div', { class: 'letter-questions' }, lt.questions.map(function (q) { return el('p', {}, q); })),
        el('button', { type: 'submit', class: 'btn', disabled: solvedB }, 'Antwort bestätigen'), fbB);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (isSolved('s8.b')) return;
        var choice = state.letterChoice;
        if (!choice) { setFeedback(fbB, 'bad', 'Wählt zuerst eine Antwort aus.'); return; }
        if (L.checkAnswer(PART['s8.b'].answer, choice)) { solve('s8.b'); return; }
        setFeedback(fbB, 'bad', 'Wirklich? Überlegt noch einmal, was passiert, wenn C wahr oder falsch wäre.');
        wrongText(WRONG); shake(letter);
      });
      letter.append(form);
      secB.append(letter);
      if (solvedB) {
        secB.append(successMsg('s8.b', lt.resolution.map(function (p) { return el('p', {}, p); })));
        secB.append(wissen(null, lt.addedExplanation.replace(/^Gut zu wissen: /, '')));
      }
      art.append(secB);
    }

    /* C: Konsole an der Tür */
    if (isSolved('s8.b')) {
      var h = st.hilbert, solvedC = isSolved('s8.c');
      var secC = partSection('s8.c', 'Die Konsole an der Tür');
      secC.append(story(h.text));
      var sel = solvedC ? st.parts[2].answer.correct.slice() : state.mcSelection.slice();
      var grid = el('div', { class: 'mc-grid', role: 'group', 'aria-label': 'Antwortknöpfe, mehrere wählbar' });
      h.options.forEach(function (o) {
        var on = sel.indexOf(o.id) >= 0;
        var b = el('button', { type: 'button', class: 'mc-btn' + (on ? ' on' : ''), 'aria-pressed': String(on), disabled: solvedC },
          el('span', { class: 'mc-box', 'aria-hidden': 'true' }, on ? '✕' : ''), el('span', {}, o.label));
        b.addEventListener('click', function () {
          var i = state.mcSelection.indexOf(o.id);
          if (i >= 0) state.mcSelection.splice(i, 1); else state.mcSelection.push(o.id);
          var nowOn = state.mcSelection.indexOf(o.id) >= 0;
          b.classList.toggle('on', nowOn); b.setAttribute('aria-pressed', String(nowOn));
          b.querySelector('.mc-box').textContent = nowOn ? '✕' : '';
          saveSoon();
        });
        grid.append(b);
      });
      var fbC = el('p', { class: 'feedback', role: 'status', 'aria-live': 'polite' });
      var screen = el('div', { class: 'console' },
        el('p', { class: 'console-statement' }, h.statement),
        el('p', { class: 'console-task' }, h.task),
        grid,
        el('button', { type: 'button', class: 'btn btn-console', disabled: solvedC, onclick: function () {
          if (isSolved('s8.c')) return;
          if (L.checkAnswer(PART['s8.c'].answer, state.mcSelection.slice())) { solve('s8.c'); return; }
          setFeedback(fbC, 'bad', state.mcSelection.length ? 'Die Tür bleibt zu. Es müssen genau die richtigen Knöpfe gedrückt sein.' : 'Drückt zuerst die Knöpfe, die ihr für richtig haltet.');
          wrongText(WRONG); shake(screen);
        } }, 'Prüfen'),
        fbC);
      secC.append(screen);
      if (solvedC) {
        secC.append(successMsg('s8.c', st.finalText));
        secC.append(wissen(null, st.addedExplanation.replace(/^Gut zu wissen: /, '')));
        secC.append(el('div', { class: 'station-nav' }, el('button', { type: 'button', class: 'door door-open door-final', onclick: function () { goFinale(); } },
          el('span', { class: 'door-ico', 'aria-hidden': 'true' }, '→'), el('span', { class: 'door-text' }, el('strong', {}, 'Durch die offene Tür'), el('small', {}, 'zum verschwundenen Manuskript')))));
      }
      art.append(secC);
    }
    art.append(navRow(door({ to: 7, back: true, secondary: true, label: 'Zurück ins Klassenzimmer', openText: 'Station 7' })));
    return art;
  };
  function truthInput(key, label) {
    var inp = el('input', { type: 'text', class: 'truth-in', maxlength: '1', inputmode: 'numeric', 'aria-label': label, autocomplete: 'off' });
    inp.value = state.truth[key] || '';
    inp.addEventListener('input', function () { state.truth[key] = inp.value; saveSoon(); });
    return inp;
  }
  function binaryForm(n) {
    var part = PART['s8.a'], solved = isSolved('s8.a');
    var input = el('input', { id: 's8-code', type: 'text', class: 'text-input mono', inputmode: 'numeric', autocomplete: 'off', spellcheck: 'false', maxlength: '24', 'aria-describedby': 's8-code-fb' });
    input.value = solved ? part.solvedDisplay : (state.drafts['s8-code'] || '');
    input.disabled = solved;
    input.addEventListener('input', function () { state.drafts['s8-code'] = input.value; saveSoon(); });
    var fb = el('p', { class: 'feedback', id: 's8-code-fb', role: 'status', 'aria-live': 'polite' });
    function key(label, act, aria) { return el('button', { type: 'button', class: 'keypad-btn', 'aria-label': aria, disabled: solved, onclick: act }, label); }
    var form = el('form', { class: 'answer-form binary-form', novalidate: true },
      el('label', { for: 's8-code', class: 'answer-label' }, 'Binäres Zahlenschloss – ' + n.codeLabel),
      el('div', { class: 'answer-row' }, input, el('button', { type: 'submit', class: 'btn', disabled: solved }, 'Tresor öffnen')),
      el('div', { class: 'keypad', role: 'group', 'aria-label': 'Tastenfeld des Tresors' },
        key('0', function () { insertAt(input, '0'); }, 'Ziffer 0 eingeben'),
        key('1', function () { insertAt(input, '1'); }, 'Ziffer 1 eingeben'),
        key('⌫', function () { input.value = input.value.slice(0, -1); input.dispatchEvent(new Event('input')); input.focus(); }, 'Letzte Ziffer löschen')),
      fb);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (isSolved('s8.a')) return;
      submitAnswer(part, input.value, fb, form, { lock: true });
    });
    return form;
  }

  /* =================== 9. Start- und Abschlussseite =================== */
  function renderStart() {
    var m = DATA.meta;
    var wrap = el('div', { class: 'start' });
    var hero = el('header', { class: 'hero' },
      el('p', { class: 'eyebrow' }, 'Ein mathematisches Escape Game'),
      el('h1', { tabindex: '-1' }, m.title),
      el('p', { class: 'hero-sub' }, m.subtitle));
    wrap.append(hero);
    wrap.append(story(DATA.frame.addedIntro, 'story-intro'));
    var actions = el('div', { class: 'start-actions' });
    if (state.started) {
      var next = state.view === 'finale' || stationDone(8) ? 'Zum Abschluss' : 'Fortsetzen (Station ' + station(state.station).order + ')';
      actions.append(el('button', { type: 'button', class: 'btn btn-big', onclick: function () { if (stationDone(8)) goFinale(); else goStation(state.station); } }, next));
      actions.append(el('button', { type: 'button', class: 'btn btn-ghost', onclick: askRestart }, 'Neues Spiel beginnen'));
    } else {
      actions.append(el('button', { type: 'button', class: 'btn btn-big', onclick: startGame }, 'Spiel starten'));
    }
    wrap.append(actions);
    wrap.append(el('section', { class: 'panel rules', 'aria-labelledby': 'rules-h' },
      el('h2', { id: 'rules-h' }, 'So wird gespielt'),
      el('ul', {}, DATA.frame.rules.map(function (r) { return el('li', {}, r); })),
      el('p', { class: 'muted small' }, 'Acht Stationen · keine Anmeldung nötig')));
    wrap.append(credits());
    return wrap;
  }
  function credits() {
    var m = DATA.meta;
    return el('section', { class: 'credits', 'aria-labelledby': 'credits-h' },
      el('h2', { id: 'credits-h' }, 'Über das Projekt'),
      el('p', {}, m.project),
      el('ul', { class: 'team' }, m.team.map(function (t) { return el('li', {}, t.name, t.role ? el('span', { class: 'role' }, ' · ' + t.role) : null); })));
  }
  function renderFinale() {
    var wrap = el('div', { class: 'finale' });
    wrap.append(el('header', { class: 'hero' },
      el('p', { class: 'eyebrow' }, 'Geschafft'),
      el('h1', { tabindex: '-1' }, 'Das Manuskript ist gefunden')));
    wrap.append(el('div', { class: 'manuscript', 'aria-hidden': 'true' }, el('span', {}, '∞')));
    wrap.append(story(DATA.frame.addedFinale, 'story-intro'));
    var hintsUsed = Object.keys(state.hints).reduce(function (a, k) { return a + state.hints[k]; }, 0);
    wrap.append(el('dl', { class: 'stats' },
      el('div', {}, el('dt', {}, 'Spielzeit'), el('dd', {}, fmtTime(elapsed()))),
      el('div', {}, el('dt', {}, 'Hinweise genutzt'), el('dd', {}, String(hintsUsed))),
      el('div', {}, el('dt', {}, 'Stationen'), el('dd', {}, '8 von 8'))));
    wrap.append(credits());
    wrap.append(el('div', { class: 'start-actions' },
      el('button', { type: 'button', class: 'btn btn-ghost', onclick: function () { goStation(8); } }, 'Zurück zu Gödel'),
      el('button', { type: 'button', class: 'btn', onclick: askRestart }, 'Neues Spiel')));
    return wrap;
  }

  /* =================== Navigation & Rendering =================== */
  function startGame() {
    state = freshState();
    state.started = true;
    timerRun();
    goStation(FIRST);
  }
  function goStation(id) {
    if (!stationUnlocked(id)) return;
    state.view = 'station'; state.station = id;
    if (state.visited.indexOf(id) < 0) state.visited.push(id);
    save();
    render({ top: true, resume: true });
  }
  function goFinale() {
    if (!stationDone(8)) return;
    state.view = 'finale';
    timerPause();
    save();
    render({ top: true });
  }

  function render(opts) {
    opts = opts || {};
    var main = $('#main');
    var y = window.scrollY;
    var view;
    if (state.view === 'station') {
      if (!stationUnlocked(state.station)) state.station = FIRST;
      view = RENDER[state.station](station(state.station));
      document.title = 'Station ' + station(state.station).order + ': ' + station(state.station).shortName + ' – ' + DATA.meta.title;
    } else if (state.view === 'finale' && stationDone(8)) {
      view = renderFinale();
      document.title = 'Geschafft – ' + DATA.meta.title;
    } else {
      state.view = 'start';
      view = renderStart();
      document.title = DATA.meta.title;
    }
    main.replaceChildren(view);
    renderTopbar();
    if (opts.top) {
      window.scrollTo(0, 0);
      var h = main.querySelector('h1');
      if (h) h.focus({ preventScroll: true });
      if (state.view === 'station' && opts.resume) {
        var target = firstOpenPart(state.station);
        if (target) setTimeout(function () { scrollToNode(target); }, 60);
      }
    } else if (opts.focus) {
      window.scrollTo(0, y);
      var t = main.querySelector(opts.focus);
      if (t) {
        t.focus({ preventScroll: true });
        t.scrollIntoView({ block: 'center', behavior: REDUCED ? 'auto' : 'smooth' });
      }
    } else {
      window.scrollTo(0, y);
    }
  }
  /* Nach dem Neuladen: zur ersten noch offenen Teilaufgabe springen */
  function firstOpenPart(id) {
    var st = station(id);
    var visibleOpen = st.parts.filter(function (p) { return !isSolved(p.id) && L.partAvailable(state, p); })[0];
    var anySolved = st.parts.some(function (p) { return isSolved(p.id); });
    if (!visibleOpen || !anySolved) return null;
    return $('#part-' + visibleOpen.id.replace('.', '-')) || null;
  }

  /* =================== 10. Start der App =================== */
  function buildCork() {
    var pat = document.getElementById('p-cork');
    if (!pat) return;
    var r = mulberry(11), s = '';
    var cols = ['#8a5631', '#c9935f', '#a46c3e', '#74451f', '#d6a774'];
    for (var i = 0; i < 70; i++) {
      s += '<circle cx="' + (r() * 140).toFixed(1) + '" cy="' + (r() * 140).toFixed(1) + '" r="' + (0.8 + r() * 2.6).toFixed(1) + '" fill="' + cols[Math.floor(r() * cols.length)] + '" opacity="' + (0.45 + r() * 0.5).toFixed(2) + '"/>';
    }
    pat.insertAdjacentHTML('beforeend', s);
  }
  function init() {
    dlg = $('#dlg');
    buildCork();
    $('#dlg-close').addEventListener('click', function () { closeDialog(true); });
    dlg.addEventListener('close', onDialogClosed);
    dlg.addEventListener('click', function (e) { if (e.target === dlg) closeDialog(true); });
    $('#btn-notebook').addEventListener('click', function (e) { openNotebook(e.currentTarget); });
    $('#btn-menu').addEventListener('click', function (e) { openMenu(e.currentTarget); });
    $('#btn-pause').addEventListener('click', function () {
      if (state.timer.running) timerPause();
      else if (state.view !== 'finale') timerRun();
      save(); updateTimer();
    });
    if (!storageOk) showStorageWarning();
    if (state.timer.running) timerSince = Date.now();
    setInterval(updateTimer, 1000);
    window.addEventListener('pagehide', persist);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persist(); });
    render({ top: true, resume: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
